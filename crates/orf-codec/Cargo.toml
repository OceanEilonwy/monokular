[package]
name = "orf-codec"
version = "0.1.0"
description = "A compact encoding of Open Receipt Format (ORF 0.1) receipts, for carrying a whole receipt in one query parameter of a payment URI"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
# Magicless frames need the experimental API.
zstd = { version = "0.13", features = ["experimental"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
