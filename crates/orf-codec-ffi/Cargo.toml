[package]
name = "orf-codec-ffi"
version = "0.1.0"
description = "orf-codec for Kotlin and Swift, through UniFFI: an ORF receipt (as JSON) appended to a payment URI"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "orf_codec_ffi"

# Generates the Kotlin and Swift bindings from the built library:
# cargo run -p orf-codec-ffi --features bindgen --bin uniffi-bindgen -- generate --library …
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
orf-codec = { path = "../orf-codec" }
serde_json = "1"
thiserror = "2"
uniffi = "=0.32.2"
