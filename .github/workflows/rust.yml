name: Rust

on:
  push:
    branches: [main]
    paths: ["crates/**", "tools/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "tools/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # orf-codec's and its bindings' tests, and the Monokular Bell's (its git
      # dependencies on monokulo are fetched at the pinned commit); receipt-qr
      # needs a downloaded corpus to run, so it is only built.
      - name: Test
        run: cargo test --locked -p orf-codec -p orf-codec-ffi -p monokular-bell
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
