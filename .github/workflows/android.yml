name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar and caches Gradle's dependencies and build cache.
      - uses: gradle/actions/setup-gradle@v6
      # The AndroidX libraries in use compile against Android 17 (API 37.2).
      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
      - name: Build, lint and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: monokular-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
