name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/**", "Cargo.*", "tools/monokulo-openapi/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/**", "Cargo.*", "tools/monokulo-openapi/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar and caches Gradle's dependencies and build cache.
      - uses: gradle/actions/setup-gradle@v6
      # The AndroidX libraries in use compile against Android 17 (API 37.2).
      - name: Install Android SDK platform and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "ndk;27.0.12077973" > /dev/null
      # The receipt module builds orf-codec-ffi from Rust (docs/decisions/android.md 8).
      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # Core's contract test generates Monokulo's OpenAPI document at the
      # pinned commit (docs/decisions/android.md 53). It needs only Rust:
      # rustup installs the toolchain Monokulo's rust-toolchain.toml names.
      - name: Pinned Monokulo commit
        id: monokulo
        run: echo "sha=$(sed -n 's/^monokulo.sha=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: android/build/monokulo-src
          key: monokulo-src-${{ runner.os }}-${{ steps.monokulo.outputs.sha }}
          restore-keys: monokulo-src-${{ runner.os }}-
      - name: cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build, lint and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: monokular-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
