[workspace]
resolver = "3"
members = ["crates/*", "tools/receipt-qr", "tools/square-sandbox"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/OceanEilonwy/monokular"

# Crates of the monokulo repository the Monokular Bell builds on (Web Push,
# settings, storage, limits, client addresses and shutdown), all at one
# commit of it, so they agree with each other (docs/decisions/bell.md 1).
# Moved with `cargo update -p push --precise <commit>` after changing `rev`.
[workspace.dependencies]
abuse = { git = "https://github.com/OceanEilonwy/monokulo", rev = "31c3cab9dd8aa1c0b2076b7df79ccd1a96a508cd" }
live-settings = { git = "https://github.com/OceanEilonwy/monokulo", rev = "31c3cab9dd8aa1c0b2076b7df79ccd1a96a508cd" }
push = { git = "https://github.com/OceanEilonwy/monokulo", rev = "31c3cab9dd8aa1c0b2076b7df79ccd1a96a508cd" }
rate-limit = { git = "https://github.com/OceanEilonwy/monokulo", rev = "31c3cab9dd8aa1c0b2076b7df79ccd1a96a508cd" }
service-runtime = { git = "https://github.com/OceanEilonwy/monokulo", rev = "31c3cab9dd8aa1c0b2076b7df79ccd1a96a508cd" }
sqlite = { git = "https://github.com/OceanEilonwy/monokulo", rev = "31c3cab9dd8aa1c0b2076b7df79ccd1a96a508cd" }

# orf-codec-ffi's library as the Android app ships it, once per ABI: small.
# (Release builds for this machine keep the defaults: UniFFI's bindgen reads
# its metadata from symbols that LTO and stripping remove.)
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true
