[package]
name = "receipt-qr"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Prototype: a full receipt inside a Monero payment QR code"


[dependencies]
ciborium = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
orf-codec = { path = "../../crates/orf-codec" }
zstd = { version = "0.13", features = ["zdict_builder"] }

[profile.release]
debug = false
