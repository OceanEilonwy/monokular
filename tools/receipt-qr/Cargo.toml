[package]
name = "receipt-qr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Prototype: a full receipt inside a Monero payment QR code"

[workspace]

[dependencies]
ciborium = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13", features = ["experimental", "zdict_builder"] }

[profile.release]
debug = false
