[package]
name = "square-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A local web page for ringing up Other: Monero sales in Square's sandbox, which has no Point of Sale app"

[dependencies]
axum = "0.8.9"
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.26.0", features = ["v4"] }
